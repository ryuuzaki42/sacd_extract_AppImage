name: Create new release

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:
  build:
    runs-on: ubuntu-22.04
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install fuse and libfuse2
      run: sudo apt install fuse libfuse2

    - name: Get appimagetool
      run: |
        set -x
        version_go_appimage=$(wget -q -O - https://api.github.com/repos/probonopd/go-appimage/releases | grep "\"name.*appimagetool-.*-x86_64.AppImage\"" | head -n 1 | cut -d '-' -f2)
        echo "version_go_appimage: $version_go_appimage"
        wget -q "https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-$version_go_appimage-x86_64.AppImage" -O appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        pwd; ls -lah

    - name: Get CrossMobile AppImage
      run: |
        set -x
        wget -q https://github.com/ryuuzaki42/sacd_extract_AppImage/releases/download/main-0000/CrossMobile-3.4.0.x86_64.AppImage
        fileName=$(ls CrossMobile*.AppImage)
        chmod +x "$fileName"
        ./"$fileName" --appimage-extract
        rm -v "$fileName"
        pwd; ls -lah

    - name: Make AppImage
      run: |
        set -x
        tag=1 #1
        version=$(grep -o "sacd_extract:.*" README.md | cut -d ' ' -f2)
        echo "sacd_extract version: $version - Tag: $tag"

        mkdir -p squashfs-root/sacd_extract/
        cp README.md squashfs-root/
        rm -v squashfs-root/AppRun
        cp AppRun squashfs-root/
        cp SACDExtractGUI.properties squashfs-root/sacd_extract/
        cd squashfs-root/

        wget -q https://github.com/ryuuzaki42/sacd_extract_AppImage/releases/download/main-0001/SACDExtractGUI.zip
        wget -q https://github.com/ryuuzaki42/sacd_extract_AppImage/releases/download/main-0001/sacd_extract-${version}-linux.zip

        unzip SACDExtractGUI.zip -d sacd_extract/
        unzip sacd_extract-${version}-linux.zip -d sacd_extract/
        rm -v SACDExtractGUI.zip sacd_extract-${version}-linux.zip
        pwd; ls -lah

        rm .DirIcon crossmobile.desktop

        #rm crossmobile.png
        mv crossmobile.png sacd_extract.png

        rm -rv app/ # Folder of CrossMobile App

        echo '[Desktop Entry]
        Type=Application
        Name=sacd_extract
        Exec=sacd_extract
        Comment=sacd_extract
        Icon=sacd_extract
        Categories=Utility
        Terminal=false' > sacd_extract.desktop
        chmod +x sacd_extract.desktop
        cat sacd_extract.desktop
        pwd; ls -lah

        cd ../
        ARCH=x86_64 VERSION="${version}-${tag}_JB" ./appimagetool-x86_64.AppImage squashfs-root/
        pwd; ls -lah

    - name: Generate MD5
      run: |
        set -x
        fileName=$(ls sacd_extract*.AppImage)
        echo "fileName: $fileName"
        md5sum "${fileName}" > "${fileName}".md5
        pwd; ls -lah

    - uses: xresloader/upload-to-github-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        file: "sacd_extract*.AppImage; sacd_extract*.zsync; sacd_extract*.md5"
        #overwrite: true
        verbose: true
        draft: false
        default_release_name: "sacd_extract V in AppImage"
